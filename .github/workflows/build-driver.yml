name: Build Virtual Display Driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
          Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet" -Wait
          Write-Host "WDK installed"

      - name: Create self-signed test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=ScrDisplay Test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build IDD driver (MSBuild)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          & $msbuild driver/idd/ScrDisplay.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:OutDir="$PWD\driver\idd\out\\"
          Write-Host "IDD driver built"

      - name: Sign IDD driver
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" `
            -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Select-Object -First 1).FullName
          & $signtool sign /sha1 $env:CERT_THUMBPRINT /td sha256 /fd sha256 `
            driver/idd/out/ScrDisplay.dll
          Write-Host "Driver signed"

      - name: Build service DLL (CMake)
        shell: pwsh
        run: |
          cmake -S driver/service -B driver/service/build `
            -G "Visual Studio 17 2022" -A x64
          cmake --build driver/service/build --config Release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item driver/idd/out/ScrDisplay.dll        artifact/
          Copy-Item driver/idd/ScrDisplay.inf            artifact/
          Copy-Item driver/service/build/Release/ScrDisplaySvc.dll artifact/
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $env:CERT_THUMBPRINT }
          Export-Certificate -Cert $cert -FilePath artifact/ScrDisplayTest.cer -Type CERT
          Get-ChildItem artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrDisplay-driver
          path: artifact/
          retention-days: 90
