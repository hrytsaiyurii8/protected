name: Build Virtual Display Driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196230"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
          Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet" -Wait
          Write-Host "WDK installed"

      - name: Install FindWDK CMake module
        shell: pwsh
        run: |
          $dest = "C:/cmake-wdk"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SergiusTheBest/FindWDK/master/cmake/FindWDK.cmake" -OutFile "$dest/FindWDK.cmake"
          echo "CMAKE_MODULE_PATH=$dest" >> $env:GITHUB_ENV

      - name: Create self-signed test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=ScrDisplay Test" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert
          $thumbprint = $cert.Thumbprint
          echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          Write-Host "Certificate thumbprint: $thumbprint"

      - name: Configure CMake (IDD driver)
        shell: pwsh
        run: |
          cmake -S driver/idd -B driver/idd/build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_MODULE_PATH="C:/cmake-wdk"

      - name: Build IDD driver
        shell: pwsh
        run: |
          cmake --build driver/idd/build --config Release

      - name: Sign IDD driver
        shell: pwsh
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Select-Object -First 1).FullName
          }
          & $signtool sign /sha1 $env:CERT_THUMBPRINT /td sha256 /fd sha256 `
            driver/idd/build/Release/ScrDisplay.dll
          Write-Host "Driver signed"

      - name: Configure CMake (service DLL)
        shell: pwsh
        run: |
          cmake -S driver/service -B driver/service/build `
            -G "Visual Studio 17 2022" -A x64

      - name: Build service DLL
        shell: pwsh
        run: |
          cmake --build driver/service/build --config Release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item driver/idd/build/Release/ScrDisplay.dll   artifact/
          Copy-Item driver/idd/build/Release/ScrDisplay.inf   artifact/ -ErrorAction SilentlyContinue
          Copy-Item driver/idd/ScrDisplay.inf                 artifact/ -ErrorAction SilentlyContinue
          Copy-Item driver/service/build/Release/ScrDisplaySvc.dll artifact/
          # Export test cert as .cer so installer can trust it
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:CERT_THUMBPRINT }
          Export-Certificate -Cert $cert -FilePath artifact/ScrDisplayTest.cer -Type CERT
          Get-ChildItem artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrDisplay-driver
          path: artifact/
          retention-days: 90
